<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0d0c12" />
    <title>Bağlantı bekleniyor · Kuzens</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        display: grid;
        margin: 0;
        place-items: center;
        padding: 24px;
        color: #f5f3ff;
        background:
          radial-gradient(circle at 50% 8%, rgba(124,92,255,.22), transparent 32%),
          #0d0c12;
        font: 15px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 480px);
        padding: clamp(28px, 7vw, 48px);
        border: 1px solid rgba(255,255,255,.09);
        border-radius: 24px;
        background: rgba(21,19,28,.92);
        box-shadow: 0 28px 80px rgba(0,0,0,.42);
        text-align: center;
      }
      .mark {
        display: grid;
        width: 62px;
        height: 62px;
        margin: 0 auto 22px;
        place-items: center;
        border-radius: 20px;
        background: linear-gradient(145deg,#a98cff,#7549ef);
        box-shadow: 0 16px 40px rgba(117,73,239,.3);
        font-size: 24px;
        font-weight: 900;
      }
      .eyebrow { color: #a98cff; font-size: 11px; font-weight: 850; letter-spacing: .15em; }
      h1 { margin: 10px 0 9px; font-size: clamp(27px,8vw,38px); line-height: 1.05; letter-spacing: -.04em; }
      p { margin: 0 auto 24px; color: #918b9e; }
      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        border-radius: 12px;
        color: white;
        background: linear-gradient(135deg,#9f7aff,#7549ef);
        font-weight: 800;
        text-decoration: none;
      }
      small { display: block; margin-top: 18px; color: #696273; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">K.</div>
      <span class="eyebrow">BAĞLANTI BEKLENİYOR</span>
      <h1>Kuzens burada, internetin biraz geride kaldı.</h1>
      <p>Mesajların ve hesabın güvende. Bağlantın geri geldiğinde kaldığın yerden devam edebilirsin.</p>
      <a href="/">Yeniden bağlan</a>
      <small>Bu sayfa cihazında çevrimdışı kullanılmak üzere saklanır.</small>
    </main>
  </body>
</html>
